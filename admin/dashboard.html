    <section class="dashboard">
        <acticle class="container">
            <div class="cardss">
                <div class="cardDashboard">
                    <h2>Total de usuarios</h2>
                    <p id="totalUsuarios"></p>
                </div>
                <div class="cardDashboard">
                    <h2>Total de productos activos</h2>
                    <p>1</p>
                </div>
                <div class="cardDashboard">
                    <h2>Total de productos inactivos</h2>

                </div>
            </div>

        </acticle>
    </section>
</body>
<SCRIpt>
    let totalUsuarios = document.querySelector('#totalUsuarios');
    let token = localStorage.getItem('token')
    if(!token){
        location.href='login.html'
    }
    const  mostrarTotal = (dato) =>{
                totalUsuarios.textContent=dato
    }
    const URLTotoalUser = 'https://verduleria-api-nycc.onrender.com/api/totalUser'
    const getTotalUser = () =>{
        fetch(URLTotoalUser,{
            method:'GET',
            headers:{
               'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}` 
            }
        })
        .then(response =>response.json())
        .then(data => mostrarTotal(data.total))
    }
    getTotalUser()

</SCRIpt>
</html>
